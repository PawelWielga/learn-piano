name: Flutter Web CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Bootstrap generated files for initial check-in
        run: |
          dart format --output=write lib test
          for f in lib/src/learn_piano_app.dart lib/src/screens/home_screen.dart test/widget_test.dart pubspec.lock; do
            echo ">>> START_FILE:${f}"
            cat "${f}"
            echo ">>> END_FILE:${f}"
          done
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Web release
        run: flutter build web --release --base-href /learn-piano/
