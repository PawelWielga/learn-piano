name: Flutter Web CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Print Dart formatting diff on failure
        if: failure()
        run: |
          dart format .
          git diff -- lib/src/training/wait_for_note_engine.dart test/training/wait_for_note_engine_test.dart test/training/wait_for_note_pipeline_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test JavaScript microphone bridge
        run: node --test test_js/*.test.cjs
      - name: Build Web release
        run: flutter build web --release --base-href /learn-piano/
