name: Flutter Web CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: |
          dart format .
          git --no-pager diff -- lib/src/pitch/note_event_tracker.dart lib/src/screens/microphone_preview_screen.dart test/pitch/note_event_tracker_test.dart test/widget_test.dart
          git diff --exit-code
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test JavaScript microphone bridge
        run: node --test test_js/*.test.cjs
      - name: Build Web release
        run: flutter build web --release --base-href /learn-piano/
