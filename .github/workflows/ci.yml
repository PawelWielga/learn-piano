name: Flutter Web CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Produce canonical realtime test formatting
        run: |
          dart format --output=write test/pitch/realtime_pcm_replay_test.dart
          echo "BEGIN_REALTIME_FORMATTED"
          base64 -w0 test/pitch/realtime_pcm_replay_test.dart
          echo
          echo "END_REALTIME_FORMATTED"
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test JavaScript microphone bridge
        run: node --test test_js/*.test.cjs
      - name: Build Web release
        run: flutter build web --release --base-href /learn-piano/
