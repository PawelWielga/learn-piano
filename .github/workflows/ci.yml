name: Flutter Web CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: |
          dart format .
          for file in lib/src/screens/training_screen.dart lib/src/widgets/training_stage.dart test/instrument/piano_keyboard_test.dart test/training/training_screen_test.dart; do
            echo "FORMATTED_FILE::$file"
            base64 -w0 "$file"
            echo
          done
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test JavaScript microphone bridge
        run: node --test test_js/*.test.cjs
      - name: Build Web release
        run: flutter build web --release --base-href /learn-piano/
