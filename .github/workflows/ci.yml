name: Flutter Web CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Show temporary MP3 formatter output
        run: dart format --output=show lib/src/audio/audio_file_picker.dart lib/src/recording/mp3_note_transcriber.dart lib/src/screens/mp3_import_screen.dart test/recording/mp3_note_transcriber_test.dart test/screens/mp3_import_screen_test.dart
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test JavaScript microphone bridge
        run: node --test test_js/*.test.cjs
      - name: Build Web release
        run: flutter build web --release --base-href /learn-piano/
