name: Synthetic MP3-to-MIDI transcription benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/mp3-to-midi/**'
      - 'app/lib/src/recording/mp3_note_transcriber.dart'
      - 'app/lib/src/transcription/**'
      - 'app/lib/src/recording/polyphonic_frame_analyzer.dart'
      - 'app/lib/src/audio/anti_alias_decimator.dart'
      - 'app/test/recording/anti_alias_decimator_test.dart'
      - 'app/tool/mp3_benchmark.dart'
      - 'app/tool/note_matching.dart'
      - 'app/test/benchmark/**'
      - '.github/workflows/mp3-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/mp3-to-midi/**'
      - 'app/lib/src/recording/mp3_note_transcriber.dart'
      - 'app/lib/src/transcription/**'
      - 'app/lib/src/recording/polyphonic_frame_analyzer.dart'
      - 'app/tool/mp3_benchmark.dart'
      - 'app/tool/note_matching.dart'
      - 'app/test/benchmark/**'
      - '.github/workflows/mp3-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Verify deterministic note matching and regression budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test fixture generator and regression gate
        run: python3 -m unittest discover -s benchmarks/mp3-to-midi -p 'test_*.py' -v
      - name: Generate original synchronized audio/MIDI
        run: python3 benchmarks/mp3-to-midi/generate.py --output /tmp/learn-piano-fixtures
      - name: Set up Flutter (Dart runtime)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve Dart packages
        working-directory: app
        run: flutter pub get
      - name: Test one-to-one note matcher
        working-directory: app
        run: flutter test test/benchmark/note_matching_test.dart
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Measure eight cases and enforce five approved baselines
        run: |
          python3 benchmarks/mp3-to-midi/run_benchmark.py \
            --fixtures /tmp/learn-piano-fixtures \
            --baseline benchmarks/mp3-to-midi/baseline.json \
            --output /tmp/learn-piano-benchmark-report
      - name: Publish concise benchmark report
        if: always()
        run: |
          if [ -f /tmp/learn-piano-benchmark-report/summary.md ]; then
            cat /tmp/learn-piano-benchmark-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Store JSON and Markdown diagnostics (no audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-transcription-metrics
          path: |
            /tmp/learn-piano-fixtures/manifest.json
            /tmp/learn-piano-benchmark-report/report.json
            /tmp/learn-piano-benchmark-report/summary.md
          retention-days: 14
