name: MP3 to MIDI benchmark

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/mp3-to-midi/**'
      - 'app/tool/mp3_benchmark.dart'
      - '.github/workflows/mp3-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Measure MP3 transcription against MIDI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout benchmark and source
        uses: actions/checkout@v4
      - name: Set up Flutter (Dart runtime)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Inspect audio metadata
        run: |
          ffprobe -v error -show_entries format=duration,bit_rate             -of default=noprint_wrappers=1             benchmarks/mp3-to-midi/your-reality/source.mp3
      - name: Decode first 80 seconds to mono float PCM
        run: |
          ffmpeg -hide_banner -loglevel error -y             -i benchmarks/mp3-to-midi/your-reality/source.mp3             -t 80 -ac 1 -ar 24000 -acodec pcm_f32le -f f32le             /tmp/your-reality.f32
      - name: Resolve Dart packages
        working-directory: app
        run: flutter pub get
      - name: Measure precision, recall and F1
        working-directory: app
        run: |
          dart run tool/mp3_benchmark.dart             /tmp/your-reality.f32             ../benchmarks/mp3-to-midi/your-reality/reference.mid
